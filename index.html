<title>Course Glossary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap&subset=vietnamese" rel="stylesheet">
<script>
/* ==========================================================================
   EDIT YOUR GLOSSARY HERE
   --------------------------------------------------------------------------
   To add a term, copy the TEMPLATE at the bottom of the list, paste it
   above the template, and fill it in.
     term        : the word, phrase or abbreviation (required)
     full        : what it stands for, if it is an abbreviation, otherwise ""
     vi          : the Vietnamese translation, or ""
     definition  : the English definition (required)
     example     : an example, or "" if you don't have one
     category    : one of the names in CATEGORIES below, spelled the same
   The page sorts terms A to Z by itself.
   Keep the comma after each closing curly bracket.
   ========================================================================== */
const SITE_TITLE    = "sylvia's supply chain glossary ⊹ ࣪ ˖";
const SITE_SUBTITLE = "helou ^_^ welcome to my amazing dictionary, this will be updated occasionally!";
const CATEGORIES    = ["Production planning", "Procurement", "Transportation", "Warehouse", "Manufacture", "Uncategorized"];

const TERMS = [
  { term: "3PL",
    full: "Third-Party Logistics",
    vi: "Nhà cung cấp dịch vụ logistics bên thứ ba",
    definition: "An outside company hired to handle logistics work such as transport, warehousing and order fulfilment.",
    example: "An online shop pays a logistics company to store its stock, pack orders and deliver them to customers.",
    category: "Transportation" },

  { term: "FTL",
    full: "Full Truckload",
    vi: "Vận chuyển nguyên xe tải",
    definition: "A shipment that fills a whole truck, or a truck booked for one customer only. Usually cheaper per unit for large volumes.",
    example: "A furniture factory books a full truck to send 300 sofas to one distribution centre.",
    category: "Transportation" },

  { term: "LTL",
    full: "Less Than Truckload",
    vi: "Vận chuyển hàng lẻ (ghép xe tải)",
    definition: "A shipment too small to fill a truck, so it shares space with other customers' goods.",
    example: "Ten pallets from a small supplier travel on the same truck as goods from four other companies.",
    category: "Transportation" },

  { term: "Incoterms",
    full: "International Commercial Terms",
    vi: "Điều kiện thương mại quốc tế",
    definition: "Standard rules from the International Chamber of Commerce that set who pays for transport, insurance and risk at each stage of an international shipment.",
    example: "Under FOB (Free On Board), the seller pays to load the goods onto the ship, and the buyer is responsible from that point.",
    category: "Transportation" },

  { term: "Last-mile delivery",
    full: "",
    vi: "Giao hàng chặng cuối",
    definition: "The final step of delivery, from a local hub to the customer's door. Often the most expensive part of shipping.",
    example: "A delivery rider bringing a parcel from the local hub to your apartment.",
    category: "Transportation" },

  { term: "B/L",
    full: "Bill of Lading",
    vi: "Vận đơn",
    definition: "A document issued by the carrier that lists the goods shipped, confirms they were received, and can act as proof of ownership.",
    example: "An exporter in Ho Chi Minh City receives a bill of lading from the shipping line once the container is loaded.",
    category: "Transportation" },

  { term: "SKU",
    full: "Stock Keeping Unit",
    vi: "Mã đơn vị lưu kho",
    definition: "A unique code for each distinct product version a business stocks, used to track inventory.",
    example: "A red T-shirt in size M and the same shirt in size L have different SKUs.",
    category: "Warehouse" },

  { term: "WMS",
    full: "Warehouse Management System",
    vi: "Hệ thống quản lý kho",
    definition: "Software that tracks stock locations and controls receiving, storing, picking and shipping inside a warehouse.",
    example: "The WMS tells a worker which shelf to pick an item from and updates stock levels when it leaves.",
    category: "Warehouse" },

  { term: "FIFO",
    full: "First In, First Out",
    vi: "Nhập trước, xuất trước",
    definition: "A stock rule where the oldest items are shipped or used first.",
    example: "A supermarket puts older milk at the front of the shelf so it sells before newer stock.",
    category: "Warehouse" },

  { term: "Cross-docking",
    full: "",
    vi: "Trung chuyển hàng không qua lưu kho",
    definition: "Moving incoming goods straight from receiving to outbound trucks with little or no storage time.",
    example: "Goods from several suppliers are unloaded, sorted by store and loaded onto delivery trucks within a few hours.",
    category: "Warehouse" },

  { term: "Picking",
    full: "",
    vi: "Lấy hàng (soạn hàng)",
    definition: "Collecting the items for a customer order from their storage locations in the warehouse.",
    example: "A worker uses a handheld scanner to collect three items for one online order.",
    category: "Warehouse" },

  { term: "BOM",
    full: "Bill of Materials",
    vi: "Định mức nguyên vật liệu",
    definition: "A complete list of the parts, materials and quantities needed to make one unit of a product.",
    example: "The BOM for a bicycle lists one frame, two wheels, one chain, one seat and so on.",
    category: "Manufacture" },

  { term: "JIT",
    full: "Just-in-Time",
    vi: "Sản xuất đúng lúc",
    definition: "Producing or receiving materials only when they are needed, to keep inventory low.",
    example: "Toyota receives car seats from its supplier just hours before they are fitted on the assembly line.",
    category: "Manufacture" },

  { term: "Lean manufacturing",
    full: "",
    vi: "Sản xuất tinh gọn",
    definition: "An approach that improves production by removing waste, such as extra stock, waiting time and defects.",
    example: "A factory rearranges its machines so parts no longer travel back and forth across the floor.",
    category: "Manufacture" },

  { term: "OEE",
    full: "Overall Equipment Effectiveness",
    vi: "Hiệu suất thiết bị tổng thể",
    definition: "A measure of how productive a machine is, calculated as availability multiplied by performance multiplied by quality.",
    example: "A machine with 90% availability, 95% performance and 98% quality has an OEE of about 84%.",
    category: "Manufacture" },

  { term: "Kaizen",
    full: "",
    vi: "Cải tiến liên tục",
    definition: "A Japanese approach of making small, ongoing improvements, with ideas coming from all employees.",
    example: "Line workers suggest moving a tool rack closer, saving ten seconds per unit.",
    category: "Manufacture" },

  { term: "MRP",
    full: "Material Requirements Planning",
    vi: "Hoạch định nhu cầu nguyên vật liệu",
    definition: "A system that uses the production schedule, BOM and stock levels to work out which materials to order and when.",
    example: "MRP calculates that 2,000 screws must be ordered this week to build next month's 500 chairs.",
    category: "Production planning" },

  { term: "MPS",
    full: "Master Production Schedule",
    vi: "Lịch trình sản xuất tổng thể",
    definition: "A plan showing how many of each finished product will be made in each time period.",
    example: "The MPS sets 1,000 phones to be produced in week 1 and 1,200 in week 2.",
    category: "Production planning" },

  { term: "Lead time",
    full: "",
    vi: "Thời gian chờ (thời gian đáp ứng)",
    definition: "The time between placing an order and receiving it, or between starting and finishing production.",
    example: "A supplier needs 14 days from receiving the order to delivering the fabric.",
    category: "Production planning" },

  { term: "Safety stock",
    full: "",
    vi: "Tồn kho an toàn",
    definition: "Extra inventory kept to protect against unexpected demand or late deliveries.",
    example: "A shop keeps 50 extra units of a best-selling item in case a delivery is delayed.",
    category: "Production planning" },

  { term: "EOQ",
    full: "Economic Order Quantity",
    vi: "Lượng đặt hàng kinh tế",
    definition: "The order size that keeps the combined cost of ordering and holding stock as low as possible. EOQ = √(2DS ÷ H).",
    example: "With yearly demand D = 1,000, order cost S = $10 and holding cost H = $2, EOQ = 100 units per order.",
    category: "Production planning" },

  { term: "Bullwhip effect",
    full: "",
    vi: "Hiệu ứng roi da",
    definition: "Small changes in customer demand grow into bigger and bigger swings in orders further up the supply chain.",
    example: "A 5% rise in store sales leads the wholesaler to order 15% more and the factory to plan 30% more.",
    category: "Production planning" },

   { term: "RFQ",
  full: "Request for Quotation",
  vi: "Yêu cầu báo giá",
  definition: "A formal document sent to suppliers requesting prices, costs, and commercial terms for specified goods or services.",
  example: "A company sends an RFQ to three suppliers to compare prices for 500 tonnes of raw cotton.",
  category: "Procurement" },

{ term: "RFI",
  full: "Request for Information",
  vi: "Yêu cầu cung cấp thông tin",
  definition: "A preliminary document used to collect general information about potential suppliers, their capabilities, products, and services before making purchasing decisions.",
  example: "A manufacturer sends an RFI to several suppliers to learn about their production capacity and available materials.",
  category: "Procurement" },

{ term: "RFP",
  full: "Request for Proposal",
  vi: "Yêu cầu đề xuất",
  definition: "A formal document inviting suppliers to submit detailed proposals explaining how they would meet a company's requirements, including pricing, solutions, and implementation plans.",
  example: "A company issues an RFP to logistics providers to find a suitable partner for managing its international distribution.",
  category: "Procurement" },

{ term: "TEU",
  full: "Twenty-foot Equivalent Unit",
  vi: "Đơn vị tương đương container 20 feet",
  definition: "A standard unit of measurement representing the capacity of one 20-foot shipping container, commonly used to measure container ship capacity and port throughput.",
  example: "A vessel with a capacity of 10,000 TEU can carry approximately 10,000 standard 20-foot containers.",
  category: "Transportation" },

{ term: "1PL",
  full: "First-Party Logistics",
  vi: "Logistics bên thứ nhất",
  definition: "A logistics model in which a company manages and performs its own logistics activities using its internal resources, without outsourcing to a third-party logistics provider.",
  example: "A manufacturer uses its own trucks and employees to transport finished products directly to customers.",
  category: "Transportation" },

{ term: "2PL",
  full: "Second-Party Logistics",
  vi: "Logistics bên thứ hai",
  definition: "A logistics model in which a company outsources a specific logistics service, such as transportation or warehousing, to an external provider that owns the relevant assets.",
  example: "A manufacturer hires a shipping company to transport its goods from Vietnam to the United States.",
  category: "Transportation" },

/* INCOTERMS 2020 */

{ term: "EXW",
  full: "Ex Works",
  vi: "Giao hàng tại xưởng",
  definition: "The seller makes the goods available at an agreed location, usually their premises. The buyer assumes almost all costs and risks from that point, including loading and export clearance.",
  example: "A Vietnamese manufacturer makes garments available at its factory in Ho Chi Minh City, and the buyer arranges collection and transportation.",
  category: "Transportation" },

{ term: "FCA",
  full: "Free Carrier",
  vi: "Giao cho người chuyên chở",
  definition: "The seller delivers the goods to the buyer's nominated carrier at an agreed location and completes export clearance. Risk transfers when delivery takes place according to the agreed location.",
  example: "A Vietnamese exporter delivers packaged garments to a carrier at a designated warehouse in Ho Chi Minh City.",
  category: "Transportation" },

{ term: "CPT",
  full: "Carriage Paid To",
  vi: "Cước phí trả tới",
  definition: "The seller pays transportation costs to the agreed destination, but risk transfers to the buyer when the goods are handed over to the first carrier.",
  example: "A Vietnamese exporter pays the freight for shipping textiles to a warehouse in Germany, although the buyer assumes risk once the goods are handed to the first carrier.",
  category: "Transportation" },

{ term: "CIP",
  full: "Carriage and Insurance Paid To",
  vi: "Cước phí và bảo hiểm trả tới",
  definition: "The seller pays transportation costs and obtains cargo insurance to the agreed destination. Risk transfers when the goods are handed over to the first carrier.",
  example: "A Vietnamese exporter arranges transportation and insurance for machinery being shipped to a buyer in France.",
  category: "Transportation" },

{ term: "DAP",
  full: "Delivered at Place",
  vi: "Giao hàng tại nơi đến",
  definition: "The seller bears the costs and risks of transporting goods to the agreed destination, where they are made available to the buyer on the arriving vehicle, ready for unloading. The buyer handles import clearance.",
  example: "A Vietnamese seller delivers furniture to the buyer's warehouse in Japan, where the buyer is responsible for unloading and import clearance.",
  category: "Transportation" },

{ term: "DPU",
  full: "Delivered at Place Unloaded",
  vi: "Giao hàng tại địa điểm đã dỡ xuống",
  definition: "The seller bears the costs and risks of transporting and unloading goods at the agreed destination. The buyer handles import clearance.",
  example: "A Vietnamese exporter arranges transportation and unloading of industrial equipment at the buyer's warehouse in South Korea.",
  category: "Transportation" },

{ term: "DDP",
  full: "Delivered Duty Paid",
  vi: "Giao hàng đã nộp thuế",
  definition: "The seller bears almost all costs and risks of delivering goods to the agreed destination, including export and import clearance, duties, and taxes. The buyer is responsible for unloading.",
  example: "A Vietnamese seller delivers products to a customer in Australia and pays the applicable import duties and taxes.",
  category: "Transportation" },

{ term: "FAS",
  full: "Free Alongside Ship",
  vi: "Giao dọc mạn tàu",
  definition: "The seller delivers goods alongside the vessel nominated by the buyer at the agreed port of shipment and completes export clearance. Risk transfers when the goods are placed alongside the vessel.",
  example: "A Vietnamese exporter delivers bulk rice alongside a vessel at Cat Lai Port for the buyer to load onto the ship.",
  category: "Transportation" },

{ term: "FOB",
  full: "Free On Board",
  vi: "Giao hàng lên tàu",
  definition: "The seller delivers goods on board the vessel nominated by the buyer at the agreed port of shipment and completes export clearance. Risk transfers when the goods are on board the vessel.",
  example: "A Vietnamese garment exporter loads a shipment onto the buyer's nominated vessel at Cat Lai Port, after which the buyer assumes the risk.",
  category: "Transportation" },

{ term: "CFR",
  full: "Cost and Freight",
  vi: "Tiền hàng và cước phí",
  definition: "The seller pays the costs and freight necessary to transport goods to the agreed destination port. However, risk transfers to the buyer once the goods are on board the vessel at the port of shipment.",
  example: "A Vietnamese exporter pays the ocean freight for shipping rice to Hamburg Port, but the buyer assumes the risk once the goods are loaded onto the vessel in Vietnam.",
  category: "Transportation" },

{ term: "CIF",
  full: "Cost, Insurance and Freight",
  vi: "Tiền hàng, bảo hiểm và cước phí",
  definition: "The seller pays the costs, ocean freight, and minimum required insurance coverage to transport goods to the agreed destination port. Risk transfers when the goods are on board the vessel at the port of shipment.",
  example: "A Vietnamese coffee exporter pays for ocean freight and insurance when shipping coffee beans to Rotterdam Port.",
  category: "Transportation" },

   { term: "VMI",
  full: "Vendor-Managed Inventory",
  vi: "Quản lý hàng tồn kho bởi nhà cung cấp",
  definition: "An inventory management strategy in which the supplier monitors the buyer's inventory levels and takes responsibility for replenishing stock based on agreed inventory targets and demand information.",
  example: "A textile supplier monitors a garment manufacturer's fabric inventory and automatically replenishes materials when stock falls below the agreed threshold.",
  category: "Procurement" },

{ term: "QC",
  full: "Quality Control",
  vi: "Kiểm soát chất lượng",
  definition: "A process of inspecting, testing, and evaluating products or production outputs to identify defects and ensure they meet established quality standards and specifications.",
  example: "A garment manufacturer conducts QC inspections to check stitching, fabric defects, measurements, and overall product quality before shipping orders to customers.",
  category: "Manufacture" },

{ term: "KPI",
  full: "Key Performance Indicator",
  vi: "Chỉ số đo lường hiệu suất chính",
  definition: "A measurable value used to evaluate how effectively an individual, department, or organization achieves specific operational or strategic objectives.",
  example: "A warehouse uses order picking accuracy, inventory accuracy, and order fulfilment time as KPIs to evaluate its operational performance.",
  category: "Uncategorized" },

   { term: "ASCM",
  full: "Association for Supply Chain Management",
  vi: "Hiệp hội Quản lý Chuỗi Cung ứng",
  definition: "A global professional association that provides supply chain education, certifications, industry standards, and professional development resources to improve supply chain management practices.",
  example: "A logistics professional obtains an ASCM certification, such as CPIM or CSCP, to develop expertise in production planning, inventory management, and end-to-end supply chain operations.",
  category: "Uncategorized" },

{ term: "SCOR",
  full: "Supply Chain Operations Reference Model",
  vi: "Mô hình tham chiếu hoạt động chuỗi cung ứng",
  definition: "A standardized framework developed by ASCM to assess, analyze, and improve supply chain performance. It organizes supply chain activities into six core processes: Orchestrate, Plan, Order, Source, Transform, and Fulfill.",
  example: "A manufacturing company uses the SCOR model to evaluate procurement efficiency, production performance, inventory levels, and delivery reliability to identify supply chain improvement opportunities.",
  category: "Uncategorized" },

   { term: "CPIM",
  full: "Certified in Planning and Inventory Management",
  vi: "Chứng chỉ Hoạch định và Quản lý Tồn kho",
  definition: "An ASCM professional certification that validates knowledge and skills in internal supply chain operations, including demand management, production planning, material requirements planning, inventory management, and continuous improvement.",
  example: "A production planner earns the CPIM certification to improve their ability to forecast material requirements, manage inventory, and coordinate production schedules.",
  category: "Production planning" },

{ term: "CSCP",
  full: "Certified Supply Chain Professional",
  vi: "Chứng chỉ Chuyên gia Chuỗi Cung ứng",
  definition: "An ASCM professional certification that validates comprehensive knowledge of end-to-end supply chain management, covering sourcing, supplier relationships, demand planning, internal operations, logistics, risk management, and supply chain optimization.",
  example: "A supply chain manager earns the CSCP certification to develop expertise in coordinating suppliers, manufacturers, distributors, and customers across the global supply chain.",
  category: "Uncategorized" },

{ term: "CLTD",
  full: "Certified in Logistics, Transportation and Distribution",
  vi: "Chứng chỉ Logistics, Vận tải và Phân phối",
  definition: "An ASCM professional certification that validates expertise in logistics operations, transportation management, warehouse management, distribution, order fulfilment, and global logistics.",
  example: "A logistics coordinator earns the CLTD certification to improve their knowledge of freight management, warehouse operations, transportation planning, and distribution networks.",
  category: "Transportation" },

{ term: "CTSC",
  full: "Certified in Transformation for Supply Chain",
  vi: "Chứng chỉ Chuyển đổi Chuỗi Cung ứng",
  definition: "An ASCM professional certification that validates strategic knowledge and capabilities in leading supply chain transformation, implementing improvements, managing change, and applying digital technologies and supply chain frameworks.",
  example: "A supply chain transformation manager earns the CTSC certification to develop strategies for digital transformation, process redesign and operational improvement.",
  category: "Uncategorized" },

  /* TEMPLATE: copy the 6 lines below, paste them above this comment, fill them in
  { term: "",
    full: "",

<style>
  :root {
    --bg: #f6f7fb; --surface: #ffffff; --surface-2: #f0f2f8;
    --text: #141826; --muted: #5d6478; --border: #e2e5ef; --faint: #c9cedc;
    --accent: #3d5afe; --accent-soft: #e8ecff; --mark: #ffe58a;
    --vi: #c2185b; --vi-soft: #fde7ef;
    --new: #0f9d58; --new-soft: #e3f6ec;
    --shadow: 0 1px 2px rgba(20,24,38,.04), 0 6px 24px rgba(20,24,38,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1117; --surface: #161a23; --surface-2: #1d2230;
      --text: #e8eaf2; --muted: #9aa1b5; --border: #2a3040; --faint: #3a4152;
      --accent: #7c93ff; --accent-soft: #232b4a; --mark: #6b5a12;
      --vi: #f48fb1; --vi-soft: #3a1d2a;
      --new: #4cd38a; --new-soft: #17301f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1117; --surface: #161a23; --surface-2: #1d2230;
    --text: #e8eaf2; --muted: #9aa1b5; --border: #2a3040; --faint: #3a4152;
    --accent: #7c93ff; --accent-soft: #232b4a; --mark: #6b5a12;
    --vi: #f48fb1; --vi-soft: #3a1d2a;
    --new: #4cd38a; --new-soft: #17301f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 Inter, system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 16px 80px; }

  header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 28px; }
  .eyebrow { font: 500 12px/1 "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.15; margin: 10px 0 6px; letter-spacing: -.02em; }
  .subtitle { color: var(--muted); margin: 0; }
  .theme-btn { flex-shrink: 0; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; }

  .controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0; display: grid; gap: 12px; }
  .search { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0 14px; box-shadow: var(--shadow); }
  .search:focus-within { border-color: var(--accent); }
  .search svg { flex-shrink: 0; color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 16px; padding: 14px 0; }
  .search kbd { font: 12px "JetBrains Mono", monospace; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; }
  .clear { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; display: none; }

  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip:disabled { color: var(--faint); cursor: default; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { opacity: .7; margin-left: 4px; font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; padding: 4px 10px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .letters { display: flex; flex-wrap: wrap; gap: 2px; }
  .letters button { width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--text); font: 600 13px Inter, sans-serif; cursor: pointer; }
  .letters button:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
  .letters button:disabled { color: var(--border); cursor: default; }
  .count { color: var(--muted); font-size: 13px; margin-left: auto; }

  .group-head { font: 700 13px "JetBrains Mono", monospace; color: var(--accent); margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); scroll-margin-top: 200px; display: flex; justify-content: space-between; }
  .group-head span { color: var(--muted); font-weight: 500; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; box-shadow: var(--shadow); display: grid; grid-template-columns: 240px 1fr; gap: 6px 24px; }
  .term { font-weight: 700; font-size: 17px; word-break: break-word; }
  .full { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .vi { display: inline-block; margin-top: 8px; font-size: 13.5px; color: var(--vi); background: var(--vi-soft); border-radius: 6px; padding: 3px 8px; }
  .vi b { font: 600 10.5px "JetBrains Mono", monospace; letter-spacing: .05em; margin-right: 6px; opacity: .8; }
  .label { font: 600 10.5px "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .def { margin: 2px 0 0; }
  .ex { margin-top: 10px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; font-size: 14px; }
  .ex p { margin: 2px 0 0; }
  .tags { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
  .tag.new { background: var(--new-soft); color: var(--new); font-weight: 600; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; text-align: center; }

  @media (max-width: 640px) {
    .card { grid-template-columns: 1fr; }
    .tags { grid-column: 1; }
    .search kbd { display: none; }
    .group-head { scroll-margin-top: 300px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">A to Z Glossary</div>
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <button class="theme-btn" id="themeBtn">Dark mode</button>
  </header>

  <div class="controls">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search in English or Vietnamese" autocomplete="off">
      <button class="clear" id="clear" aria-label="Clear search">×</button>
      <kbd>/</kbd>
    </label>
    <div class="row" id="filters"></div>
    <div class="row">
      <div class="seg" id="groupBy">
        <button data-g="letter" aria-pressed="true">A to Z</button>
        <button data-g="cat" aria-pressed="false">By category</button>
      </div>
      <div class="letters" id="letters"></div>
      <span class="count" id="count"></span>
    </div>
  </div>

  <main id="list"></main>
  <footer id="footer"></footer>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const data = TERMS.filter(t => t.term && t.definition)
    .sort((a, b) => a.term.localeCompare(b.term, undefined, { sensitivity: "base" }));
  let activeFilter = "all", groupBy = "letter";

  $("title").textContent = SITE_TITLE;
  $("subtitle").textContent = SITE_SUBTITLE;
  $("footer").textContent = data.length + " terms in " + CATEGORIES.length + " categories";
  document.title = SITE_TITLE;

  // Category chips: All + each category (categories with no terms yet are greyed out)
  const perCat = c => data.filter(t => t.category === c).length;
  let chipHtml = `<button class="chip" data-k="all" aria-pressed="true">All<span class="n">${data.length}</span></button>`;
  for (const c of CATEGORIES) {
    const n = perCat(c);
    chipHtml += `<button class="chip" data-k="${esc(c)}" aria-pressed="false" ${n ? "" : "disabled"}>${esc(c)}${n ? `<span class="n">${n}</span>` : ""}</button>`;
  }
  $("filters").innerHTML = chipHtml;
  $("filters").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b || b.disabled) return;
    activeFilter = b.dataset.k;
    $("filters").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    render();
  });
  $("groupBy").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    groupBy = b.dataset.g;
    $("groupBy").querySelectorAll("button").forEach(c => c.setAttribute("aria-pressed", c === b));
    render();
  });

  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
  // Lowercase and strip accents so "bao mat" finds "bảo mật"
  function norm(s) { return String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d"); }
  function highlight(text, words) {
    const html = esc(text);
    if (!words.length) return html;
    const re = new RegExp("(" + words.map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
    return html.replace(re, "<mark>$1</mark>");
  }
  function letterOf(t) { const c = norm(t.term.trim()[0]).toUpperCase(); return /[A-Z]/.test(c) ? c : "#"; }

  function card(t, words, anchor) {
    return `<article class="card"${anchor}>
      <div>
        <div class="term">${highlight(t.term, words)}</div>
        ${t.full ? `<div class="full">${highlight(t.full, words)}</div>` : ""}
        ${t.vi ? `<div class="vi"><b>VI</b>${highlight(t.vi, words)}</div>` : ""}
      </div>
      <div>
        <div class="label">Definition</div>
        <p class="def">${highlight(t.definition, words)}</p>
        ${t.example ? `<div class="ex"><div class="label">Example</div><p>${highlight(t.example, words)}</p></div>` : ""}
      </div>
      <div class="tags">
        ${t.category ? `<span class="tag">${esc(t.category)}</span>` : ""}
      </div></article>`;
  }

  function render() {
    const raw = $("q").value.trim();
    const words = raw.toLowerCase().split(/\s+/).filter(Boolean);
    const nwords = words.map(norm);
    $("clear").style.display = raw ? "block" : "none";

    const rows = data.filter(t => {
      if (activeFilter !== "all" && t.category !== activeFilter) return false;
      const hay = norm([t.term, t.full, t.vi, t.definition, t.example].join(" "));
      return nwords.every(w => hay.includes(w));
    });

    if (words.length) {
      const q = norm(raw);
      const score = t => norm(t.term) === q ? 0 : norm(t.term).startsWith(q) ? 1 : norm(t.term).includes(q) ? 2 : 3;
      rows.sort((a, b) => score(a) - score(b) || a.term.localeCompare(b.term));
    }

    $("count").textContent = `${rows.length} of ${data.length} terms`;

    const byLetter = groupBy === "letter";
    const present = new Set(rows.map(letterOf));
    $("letters").style.display = byLetter ? "" : "none";
    $("letters").innerHTML = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(L =>
      `<button data-l="${L}" ${present.has(L) ? "" : "disabled"}>${L}</button>`).join("");

    if (!rows.length) {
      $("list").innerHTML = `<div class="empty">No terms match "${esc(raw)}".</div>`;
      return;
    }

    let html = "";
    if (byLetter) {
      let last = "";
      const seen = new Set();
      for (const t of rows) {
        const L = letterOf(t);
        let anchor = "";
        if (!words.length && L !== last) { html += `<div class="group-head" id="L-${L}">${L}</div>`; last = L; }
        else if (words.length && !seen.has(L)) { anchor = ` id="L-${L}"`; seen.add(L); }
        html += card(t, words, anchor);
      }
    } else {
      for (const c of CATEGORIES) {
        const group = rows.filter(t => t.category === c);
        if (!group.length) continue;
        html += `<div class="group-head">${esc(c)}<span>${group.length} terms</span></div>`;
        html += group.map(t => card(t, words, "")).join("");
      }
      const noCat = rows.filter(t => !CATEGORIES.includes(t.category));
      if (noCat.length) html += `<div class="group-head">No category set</div>` + noCat.map(t => card(t, words, "")).join("");
    }
    $("list").innerHTML = html;
  }

  $("letters").addEventListener("click", e => {
    const b = e.target.closest("button[data-l]"); if (!b) return;
    document.getElementById("L-" + b.dataset.l)?.scrollIntoView({ behavior: "smooth" });
  });
  $("q").addEventListener("input", render);
  $("clear").addEventListener("click", e => { e.preventDefault(); $("q").value = ""; render(); $("q").focus(); });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
    if (e.key === "Escape") { $("q").value = ""; render(); }
  });

  // Dark mode toggle (remembers the choice)
  const root = document.documentElement;
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  try { const s = localStorage.getItem("logistics-theme"); if (s) root.dataset.theme = s; } catch (_) {}
  const syncBtn = () => $("themeBtn").textContent = isDark() ? "Light mode" : "Dark mode";
  $("themeBtn").addEventListener("click", () => {
    root.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("logistics-theme", root.dataset.theme); } catch (_) {}
    syncBtn();
  });
  syncBtn();
  render();
})();
</script>
</body>
</html>
